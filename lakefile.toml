name = "sort-service"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["SortService"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.1"

[[require]]
name = "contracts"
git = "https://github.com/vailaya-stack/contracts"
rev = "v0.2.2"

[[lean_lib]]
name = "SortService"
srcDir = "src"
globs = ["SortService.*"] # every file under src/SortService/, imported by the root or not
