name: Upgrade contracts

on:
  repository_dispatch:
    types: [contracts-released] # sent by the Release workflow of the contracts
  schedule:
    - cron: "23 * * * *" # hourly, in case that was missed
  workflow_dispatch:

permissions:
  contents: read

concurrency: upgrade-contracts

jobs:
  # Opens a pull request that moves the pins to the latest release of the contracts.
  # The branch and the pull request are made as the org's app, vailaya-stack-app, so their
  # checks run as for any push.
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Get the app's token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          token: ${{ steps.app.outputs.token }}

      - name: Move the pins to the latest release
        id: pins
        run: python3 scripts/upgrade_contracts.py

      - name: Skip a release that has its branch already
        id: branch
        if: steps.pins.outputs.release != ''
        env:
          BRANCH: contracts-${{ steps.pins.outputs.release }}
        run: |
          echo "name=${BRANCH}" >> "${GITHUB_OUTPUT}"
          if [ -n "$(git ls-remote --heads origin "${BRANCH}")" ]; then
            echo "${BRANCH} exists already"
          else
            echo "new=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Install Lean
        if: steps.branch.outputs.new == 'true'
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "${HOME}/.elan/bin" >> "${GITHUB_PATH}"

      - name: Resolve the pins
        if: steps.branch.outputs.new == 'true'
        env:
          MATHLIB_NO_CACHE_ON_UPDATE: "1" # the manifest is all this needs, not Mathlib's build
        run: lake update contracts mathlib

      - name: Push the branch and open the pull request
        if: steps.branch.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP: ${{ steps.app.outputs.app-slug }}
          BRANCH: ${{ steps.branch.outputs.name }}
          RELEASE: ${{ steps.pins.outputs.release }}
        run: |
          id="$(gh api "/users/${APP}%5Bbot%5D" --jq .id)"
          git config user.name "${APP}[bot]"
          git config user.email "${id}+${APP}[bot]@users.noreply.github.com"
          git checkout --quiet -b "${BRANCH}"
          git commit --quiet --all --message "Move to contracts ${RELEASE}"
          git push --quiet origin "${BRANCH}"
          gh pr create --base main --head "${BRANCH}" \
            --title "Move to contracts ${RELEASE}" \
            --body "Moves the pins to the release ${RELEASE} of the contracts. Opened by the Upgrade contracts workflow."
